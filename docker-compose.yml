services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-Actuate API}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://actuate:actuate@db:5432/actuate}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_MODEL: ${SARVAM_MODEL:-sarvam-105b}
      SARVAM_TIMEOUT_SECONDS: ${SARVAM_TIMEOUT_SECONDS:-8}
      SARVAM_MAX_RETRIES: ${SARVAM_MAX_RETRIES:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["sh", "-c", "PYTHONPATH=src python -m backend.scripts.migrate && exec uvicorn backend.app:app --host 0.0.0.0 --port 8000"]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-actuate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-actuate}
      POSTGRES_DB: ${POSTGRES_DB:-actuate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-actuate}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
